<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG icons are what makes Chrome on Android offer "Install". With only an
         SVG it silently never prompts, so most target users had no way to add
         the app to their home screen at all. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#D4AF37" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Dinki.africa — Modern tailoring management & marketplace for African fashion designers" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://be.dinki.africa" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <title>Dinki.africa — Tailoring Management & Marketplace</title>
    <!-- Matomo (analytics.aictig.org, site id 4) -->
    <!--
      SPA-aware setup. We fire an IMMEDIATE trackPageView here so the very
      first hit is captured without waiting on React boot + auth refresh —
      both Matomo's installation verifier and real "bounce before render"
      visitors depend on this. React then takes over for every subsequent
      route change (src/components/MatomoRouteTracker.jsx) and skips its
      own first emission to avoid double-counting this initial pageview.
      Tracking is gated to the production hostname so local dev traffic
      doesn't pollute the data.
    -->
    <script>
      (function () {
        var _paq = window._paq = window._paq || [];
        _paq.push(["setCookieDomain", "*.dinki.africa"]);
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        if (!/(^|\.)dinki\.africa$/i.test(window.location.hostname)) return;
        var u = "https://analytics.aictig.org/";
        _paq.push(['setTrackerUrl', u + 'matomo.php']);
        _paq.push(['setSiteId', '4']);
        var d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0];
        g.async = true; g.src = u + 'matomo.js'; s.parentNode.insertBefore(g, s);
      })();
    </script>
    <!-- End Matomo -->
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
